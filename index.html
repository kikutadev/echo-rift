<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050811">
<title>ECHO RIFT</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./src/style.css?v=20261008-dash2">
</head>
<body>
<main id="app" class="ui-blocked intro">
<canvas id="game" width="960" height="600" aria-label="ECHO RIFT game field"></canvas>
<section id="hud" aria-label="プレイ情報">
<div class="hud-main">
<span id="time" class="hud-time">08:00</span>
<span id="level" class="hud-level">LV 1</span>
</div>
<div class="hud-bars">
<div class="hp-track"><i id="hpbar"></i></div>
<div class="xp-track"><b id="xpbar"></b></div>
</div>
<span id="score" class="hud-score">0</span>
</section>
<section id="start" class="start-screen" aria-label="ゲーム開始">
<div class="start-vignette"></div>
<div class="start-copy">
<h1>ECHO RIFT</h1>
<p class="start-mode">8分サバイバル</p>
<div class="start-rules">
<span>移動：左スティック</span>
<span>攻撃：自動</span>
<span>ダッシュ：右ボタン</span>
</div>
<button id="startBtn"><span aria-hidden="true">▶</span> タップして開始</button>
</div>
</section>
<div id="tutorial" class="tutorial hidden" aria-live="polite">
<strong>左で移動　右でダッシュ</strong>
<span>攻撃は自動です</span>
<small class="tutorial-desktop">WASD / 矢印で移動　・　SPACEでダッシュ</small>
<small class="tutorial-mobile">3秒前の動きが残像として攻撃します</small>
</div>
<section id="upgrade" class="panel hidden">

<h2>強化を1つ選ぶ</h2>
<div id="upgradeChoices"></div>
</section>
<section id="result" class="panel hidden">
<p class="eyebrow" id="resultLabel"></p>
<h2 id="resultTitle">結果</h2>
<div id="resultStats"></div>
<button id="retryBtn">もう一度遊ぶ</button>
</section>
<div id="dashButton" aria-label="ダッシュ">ダッシュ</div>
<div id="joystick"><i></i></div>
<div id="toast"></div>
</main>
<script type="module" src="./src/main.js?v=20261008-dash2"></script>
</body>
</html>
